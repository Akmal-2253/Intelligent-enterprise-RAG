version: '3.8'

services:
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: streamlit_frontend
    restart: unless-stopped
    # Notice we removed ports: - "8501:8501" so it's hidden securely behind Caddy
    expose:
      - "8501"
    environment:
      - PORT=8501

volumes:
  caddy_data:
  caddy_config: