name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: akmal-2253/intelligent-enterprise-rag-backend
  FRONTEND_IMAGE: akmal-2253/intelligent-enterprise-rag-frontend

jobs:
  test:
    # UNCHANGED from your original -- this is correct as-is.
    # The postgres service below is throwaway/test-only, isolated from
    # your real Neon database. Never point this at Neon.
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_db
      FAISS_INDEX_DIR: ./faiss_index
      EMBEDDING_PROVIDER: fastembed
      LLM_PROVIDER: groq
      GROQ_API_KEY: dummy_key_for_ci

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  # CHANGED: this used to be "docker-build" and stopped after building
  # locally (docker build -t rag-backend:ci). Now it also LOGS IN and
  # PUSHES to GHCR -- a build that's never pushed anywhere is useless for
  # deployment, it only existed to catch Dockerfile errors before.
  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    # only push real images on an actual merge to main -- PRs still build
    # (catches Dockerfile breakage) but shouldn't publish new image tags
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write   # required to push to GHCR

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # auto-provided, no PAT needed for same-repo GHCR push

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.streamlit
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  # NEW: this stage didn't exist before -- your old workflow had no
  # equivalent because deploying to a VM was presumably manual (or a
  # separate SSH-based job not shown here). This replaces that step,
  # pointed at AKS instead of a VM.
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}   # service principal JSON, see README

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: rag-system-rg     
          cluster-name: rag-aks-cluster           

      - name: Update image tags in Deployments
        run: |
          kubectl set image deployment/fastapi-deployment \
            fastapi=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}

          kubectl set image deployment/frontend-deployment \
            frontend=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Wait for rollout to finish
        run: |
          kubectl rollout status deployment/fastapi-deployment --timeout=180s
          kubectl rollout status deployment/frontend-deployment --timeout=180s