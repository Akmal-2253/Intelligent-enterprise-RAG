services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Named volume -- Postgres data survives `docker-compose down` and
      # container recreation, only wiped by an explicit `down -v`.
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides the .env value (which is "localhost", correct for
      # bare-metal). Inside the Docker network, containers reach each
      # other by SERVICE NAME -- "postgres" here is the service name
      # defined above, not a hostname that exists anywhere else.
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Bind mounts (not named volumes) -- these map straight to real
      # folders on your machine, same ones you were already using
      # bare-metal, so uploaded PDFs and the FAISS index persist across
      # container rebuilds and are inspectable directly from the host.
      - ./documents:/app/documents
      - ./faiss_index:/app/faiss_index

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    restart: unless-stopped
    environment:
      API_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "8501:8501"

volumes:
  postgres_data: